[project]
name = "benchmarker"
version = "2.3.6"
description = "Benchmark and tuning tool for local GGUF models on GPU PCs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Victor Nwokeocha", email = "nwokeochavictor@gmail.com" }]
requires-python = ">=3.11"
dependencies = []                                                              # stdlib-only — no runtime dependencies

[project.scripts]
benchmarker = "benchmarker:main"

[project.urls]
Homepage = "https://github.com/veeqtor/benchmarker"
Repository = "https://github.com/veeqtor/benchmarker"
Issues = "https://github.com/veeqtor/benchmarker/issues"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = ["pytest>=8.0"]
